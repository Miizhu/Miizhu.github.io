  const limitConfig = {}

  const escapeHtml = str => String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;')

  const sortDataByDate = data => data.sort((a, b) => new Date(b.date) - new Date(a.date))

  const filterDataByLimit = (data, limit) => {
    if (!limit || !limit.type) return data
    if (limit.type === 'num') return data.slice(0, limit.value)
    if (limit.type === 'date') {
      const limitDate = new Date(limit.value)
      return data.filter(item => new Date(item.date) >= limitDate)
    }
    return data
  }

  const dateFormatter = new Intl.DateTimeFormat('en-GB', {
    timeZone: "Asia/Shanghai" || Intl.DateTimeFormat().resolvedOptions().timeZone,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false
  })

  const formatToTimeZone = (date) => {
    const fullDate = date.length === 10 ? `${date} 00:00:00` : date
    const [day, month, year, hour, minute, second] = dateFormatter.format(new Date(fullDate)).match(/\d+/g)
    return `${year}-${month}-${day} ${hour}:${minute}:${second}`
  }

  const addLazyload = str => {
    const lazyConfig = {
      enable: false,
      native: false,
      field: "site",
      placeholder: "/null",
    }

    if (!lazyConfig.enable || lazyConfig.field !== 'site' || str.indexOf('<img') === -1) return str
    const parser = new DOMParser()
    const doc = parser.parseFromString(str, 'text/html')
    const images = doc.querySelectorAll('img')

    images.forEach(img => {
      if (lazyConfig.native) {
        img.setAttribute('loading', 'lazy')
      } else {
        const src = img.getAttribute('src')
        img.setAttribute('data-lazy-src', src)

        if (lazyConfig.placeholder) {
          img.setAttribute('src', lazyConfig.placeholder)
        } else {
          img.removeAttribute('src')
        }
      }
    })
    return doc.body.innerHTML
  }

  let currentPage = 1
  const itemsPerPage = 8
  let totalPages = 0
  let data = []

  const renderData = (dataSlice) => {
    const content = dataSlice.map(item => {
      const formattedDate = formatToTimeZone(item.date)
      const tags = item.tags && item.tags.map(tag => `<span class="shuoshuo-tag">${escapeHtml(tag)}</span>`).join('') || ''
      const commentButton = item.key && false
        ? `<div class="shuoshuo-comment-btn" onclick="addCommentToShuoshuo(event)">
            <i class="fa-solid fa-comments"></i>

      return `

          ${commentContainer}

    const container = document.getElementById('article-container')

  }

  const setupNavEvents = (nav) => {

      if (currentPage > 1) { currentPage--; renderPage(currentPage) }
    })
    nav.querySelector('.shuoshuo-next-btn').addEventListener('click', () => {
      if (currentPage < totalPages) { currentPage++; renderPage(currentPage) }
    })

    const input = nav.querySelector('.shuoshuo-page-input')

    input.addEventListener('focus', e => { e.target.placeholder = '' })
    input.addEventListener('blur', e => {
      if (!e.target.value.trim()) e.target.placeholder = currentPage
    })

    input.addEventListener('input', e => {
      const value = parseInt(e.target.value) || 0
      let wasInvalid = false

      if (value > totalPages) { e.target.value = totalPages; wasInvalid = true }
      else if (value < 1 && e.target.value !== '') { e.target.value = 1; wasInvalid = true }

      if (wasInvalid) {
        e.target.classList.add('invalid')
        setTimeout(() => e.target.classList.remove('invalid'), 500)
      }
    })

    input.addEventListener('keydown', e => {
      const value = e.target.value + e.key

      if (e.key === 'Enter' || e.key === 'Backspace' || e.key === 'Delete' ||
          e.key === 'ArrowLeft' || e.key === 'ArrowRight' ||

        if (e.key === 'Enter') {
          const inputValue = e.target.value.trim()
          const inputPage = inputValue === '' ? currentPage : parseInt(inputValue)
          if (inputPage >= 1 && inputPage <= totalPages && inputPage !== currentPage) {
            currentPage = inputPage

      if (!/^\d$/.test(e.key)) {

      }

        e.target.classList.add('invalid')
        setTimeout(() => e.target.classList.remove('invalid'), 500)
      }
    })
  }

    nav.querySelector('.shuoshuo-page-info').textContent = pageInfoText

  }

  const renderPage = (page) => {
    const start = (page - 1) * itemsPerPage
    const end = start + itemsPerPage
    const pageData = data.slice(start, end)
    renderData(pageData)
    renderNavigation()
  }

  const loadShuoshuo = async () => {
    const container = document.getElementById('article-container')
    try {

      }

      totalPages = Math.ceil(data.length / itemsPerPage)

      if (data.length === 0) {
        container.innerHTML = '<div class="shuoshuo-empty"></div>'
        return
      }

      renderPage(currentPage)
    } catch (error) {
      console.error(error)
      container.innerHTML = '<div class="shuoshuo-error"><i class="fa-solid fa-circle-exclamation"></i></div>'
    }
  }

  const pjaxCleanup = () => {
    const container = document.getElementById('article-container')
    if (container) {
      const nav = container.nextElementSibling
      if (nav && nav.classList.contains('shuoshuo-navigation')) nav.remove()
    }
    document.removeEventListener('pjax:send', pjaxCleanup)
  }

    document.addEventListener('pjax:send', pjaxCleanup)
    loadShuoshuo()
  } else {
    window.addEventListener('load', loadShuoshuo)
  }
})()</script></div></div><div class="aside-content" id="aside-content"><div class="card-widget card-info text-center"><div class="avatar-img"><img src="https://cdn.jsdelivr.net/gh/Miizhu/picgo@main/images/user.jpg" onerror="this.onerror=null;this.src='/img/friend_404.gif'" alt="avatar"/></div><div class="author-info-name">Miizhu</div><div class="author-info-description">学习记录与个人疑难解决路径</div><div class="site-data"><a href="/archives/"><div class="headline">文章</div><div class="length-num">2</div></a><a href="/tags/"><div class="headline">标签</div><div class="length-num">0</div></a><a href="/categories/"><div class="headline">分类</div><div class="length-num">0</div></a></div><a id="card-info-btn" target="_blank" rel="noopener" href="https://github.com/xxxxxx"><i class="fab fa-github"></i><span>Follow Me</span></a></div><div class="card-widget card-announcement"><div class="item-headline"><i class="fas fa-bullhorn fa-shake"></i><span>公告</span></div><div class="announcement_content">This is my Blog</div></div><div class="sticky_layout"><div class="card-widget card-recent-post"><div class="item-headline"><i class="fas fa-history"></i><span>最新文章</span></div><div class="aside-list"><div class="aside-list-item no-cover"><div class="content"><a class="title" href="/2026/08/02/%E7%AC%AC%E4%B8%80%E7%AF%87%E5%8D%9A%E5%AE%A2/" title="第一篇博客">第一篇博客</a><time datetime="2026-08-02T12:48:19.000Z" title="发表于 2026-08-02 20:48:19">2026-08-02</time></div></div><div class="aside-list-item no-cover"><div class="content"><a class="title" href="/2026/08/02/hello-world/" title="Hello World">Hello World</a><time datetime="2026-08-02T09:59:02.677Z" title="发表于 2026-08-02 17:59:02">2026-08-02</time></div></div></div></div><div class="card-widget card-archives">
